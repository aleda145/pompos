{{define "content"}}
<div class="page-heading">
  <h1>Chats</h1>
  <a class="button primary" href="/ingestions/new">New chat</a>
</div>
{{if .Chats}}
<div class="table-scroll" role="region" aria-label="Chats" tabindex="0">
  <table>
    <caption class="sr-only">Saved chats</caption>
    <thead><tr><th scope="col">Conversation</th><th scope="col">Updated<span data-display-timezone> · UTC</span></th><th scope="col">Ingestions</th></tr></thead>
    <tbody>
    {{range .Chats}}
      <tr><th scope="row"><a class="table-name" href="/chat/{{.ID}}">{{.Title}}</a></th><td class="mono nowrap">{{template "timestamp" .UpdatedAt}}</td><td class="mono">{{.SavedCount}}</td></tr>
    {{end}}
    </tbody>
  </table>
</div>
{{else}}
<div class="empty">No chats.</div>
{{end}}
{{end}}
