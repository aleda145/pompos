{{define "content"}}
<div class="chat-heading"><div><h1 id="chat-title">New ingestion</h1></div><a href="/ingestions/new">New chat</a><a href="/settings">Agent settings</a></div>
<div id="chat" data-id="{{.Session.ID}}">
 <div id="chat-empty"><button type="button" id="example" class="suggestion">Example: GitHub stargazers</button></div>
 <div id="messages" class="chat-log" aria-label="Conversation"></div>
 <div id="working" class="chat-state mono" role="status" aria-live="polite">IDLE</div>
 <div id="handoff" hidden></div>
 <div id="chat-error" class="error" role="alert" hidden></div>
 <div id="recovery" class="quick-actions" hidden><button type="button" id="retry-turn" class="suggestion">Retry</button><a href="/settings">Agent settings</a></div>
 <details id="draft" class="chat-artifact" hidden><summary>Ingestion draft <span id="draft-target"></span></summary><pre class="yaml-code"><code id="draft-code" class="language-python"></code></pre></details>
 <p id="validation-result" class="hint" role="status" hidden></p>
 <form id="publish" class="chat-publish" method="post" action="/chat/{{.Session.ID}}/publish" hidden><span id="publish-status"></span><button class="primary" type="submit">Save ingestion</button></form>
 <div class="chat-composer">
  <form id="chat-form"><label for="message" class="sr-only">Message the agent</label><textarea id="message" rows="2" maxlength="16000" required placeholder="Source URL, table, or configuration change"></textarea><div class="composer-footer"><button id="send" class="primary" type="submit">Send</button></div></form>
 </div>
 <div id="published" hidden><p>Saved ingestions</p><ul id="saved-ingestions"></ul></div>
</div>
<script id="chat-state" type="application/json">{{.Session}}</script>
<script src="/static/chat-stream.js" defer></script>
<script src="/static/chat.js" defer></script>
{{end}}
