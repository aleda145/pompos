apiVersion: pompos.dev/v1alpha1
kind: Ingestion
metadata:
  name: customers
  owner: data-platform
source:
  type: python
  url: https://example.com/customers.csv
  table: customers
destination:
  type: duckdb
  path: data/pompos.duckdb
  object: customers
materialization:
  strategy: replace
runtime:
  script: data/ingestions/customers.py
  secretRefs:
    - source-key
  engine: python
  orchestrator: direct
